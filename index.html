    <script>
      (function() {
        if (typeof window !== 'undefined') {
          // 1. Capture-phase error handler for ResizeObserver benign notifications
          window.addEventListener('error', function(e) {
            var msg = e.message || (e.error && e.error.message) || '';
            if (typeof msg === 'string' && msg.indexOf('ResizeObserver') !== -1) {
              e.stopImmediatePropagation();
              e.stopPropagation();
              e.preventDefault();
              return false;
            }
          }, true);

          // 2. Global error handler fallback
          var origOnError = window.onerror;
          window.onerror = function(msg, url, line, col, err) {
            if (typeof msg === 'string' && msg.indexOf('ResizeObserver') !== -1) {
              return true;
            }
            if (origOnError) return origOnError.apply(this, arguments);
            return false;
          };

          // 3. Safe requestAnimationFrame wrapper for ResizeObserver to prevent layout thrashing loops
          if (window.ResizeObserver) {
            var NativeResizeObserver = window.ResizeObserver;
            window.ResizeObserver = function(callback) {
              return new NativeResizeObserver(function(entries, observer) {
                window.requestAnimationFrame(function() {
                  callback(entries, observer);
                });
              });
            };
            window.ResizeObserver.prototype = NativeResizeObserver.prototype;
          }
        }
      })();
    </script>
